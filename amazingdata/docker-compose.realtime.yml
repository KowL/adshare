# amazingdata/docker-compose.realtime.yml
# Realtime subscription service (盘中).
#
# Config: amazingdata/realtime.env (gitignored) — realtime-dedicated TGW
# account + Redis credentials. realtime and batch use SEPARATE TGW accounts,
# so both services may run simultaneously. Never run two containers with the
# SAME account — TGW force-logouts the earlier session.
#
# Build:
#   docker compose -f amazingdata/docker-compose.realtime.yml build
# Run:
#   docker compose -f amazingdata/docker-compose.realtime.yml up -d

name: amazingdata-realtime

services:
  amazingdata-realtime:
    build:
      context: ..
      dockerfile: amazingdata/realtime.Dockerfile
    image: amazingdata-realtime:latest
    platform: linux/amd64
    container_name: amazingdata-realtime
    # SDK (InfoData) hardcodes a Windows-style local path "D://AmazingData_local_data"
    # and creates it relative to the working directory. Set working_dir to /app/data
    # so the cache lands inside the mounted host data directory.
    working_dir: /app/data
    env_file:
      - realtime.env
    environment:
      - DATABASE_POOL_MIN_SIZE=${DATABASE_POOL_MIN_SIZE:-1}
      - DATABASE_POOL_MAX_SIZE=${DATABASE_POOL_MAX_SIZE:-2}
      - DATABASE_AUTO_MIGRATE=false
      - ADSHARE_LOG_LEVEL=${ADSHARE_LOG_LEVEL:-INFO}
      - ADSHARE_LOG_DIR=/app/logs
      # Pin timezone to Asia/Shanghai so APScheduler cron (configured in CST)
      # fires at the intended local hour instead of UTC.
      - TZ=Asia/Shanghai
      # Ensure amazingdata package stays importable when working_dir is /app/data
      - PYTHONPATH=/app
    volumes:
      - ../cache:/app/cache
      - ../logs:/app/logs
    networks:
      - adshare
    restart: unless-stopped

networks:
  adshare:
    external: true
    name: ${ADSHARE_NETWORK:-adshare_default}
