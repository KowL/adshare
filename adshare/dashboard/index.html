<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>adshare service dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-title">
        adshare service dashboard
        <small id="clock">--:--:--</small>
      </h1>
      <div class="controls">
        <label for="apiKey">API key</label>
        <input id="apiKey" type="password" autocomplete="off"
               placeholder="X-API-Key" />
        <button id="testBtn">Test</button>
        <button id="alertsBtn" disabled>Enable alerts</button>
        <button class="link-button" id="debugToggle">debug</button>
      </div>
    </header>

    <div id="banner" class="banner" style="display:none"></div>

    <section class="cards" id="cards">
      <!-- Service cards injected by app.js -->
    </section>

    <section class="row">
      <div class="panel" id="realtimePanel">
        <h2>Realtime counters</h2>
        <div class="counter-grid" id="counters">
          <!-- counter boxes injected by app.js -->
        </div>
      </div>
      <div class="panel" id="sparklinePanel">
        <h2>Realtime activity (30 min)</h2>
        <svg class="spark" id="spark" viewBox="0 0 600 64"
             preserveAspectRatio="none">
          <line class="axis" x1="0" y1="32" x2="600" y2="32" />
          <polyline class="line" id="sparkLine" points="" />
        </svg>
        <div id="sparkMeta" class="meta"
             style="color: var(--text-dim); font-size: 12px;
                    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                    margin-top: 6px;"></div>
      </div>
    </section>

    <section class="panel">
      <h2>Historical data freshness</h2>
      <table class="freshness" id="freshness">
        <thead>
          <tr>
            <th>Period</th>
            <th>Latest trade date</th>
            <th>Complete through</th>
            <th>Codes</th>
            <th>Last run</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="freshnessBody">
          <!-- rows injected by app.js -->
        </tbody>
      </table>
    </section>

    <section class="debug hidden" id="debugPane">
      <h2 style="margin:0 0 10px; font-size:13px; text-transform:uppercase;
                 letter-spacing:0.06em; color:var(--text-dim);">
        Raw /status payload
      </h2>
      <pre id="debugPre"></pre>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
